name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r node/requirements.txt
      - name: Run node tests
        working-directory: node
        run: python -m unittest discover tests -v

  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to attach the APK to a release on tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../stellarite-miner.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stellarite-miner-apk
          path: stellarite-miner.apk
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: stellarite-miner.apk
